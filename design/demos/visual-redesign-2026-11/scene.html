<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gambit 樣張・方向 B「棋境一景」</title>
<style>
/* ---- self-hosted fonts (same files and family names as src/assets/fonts.css) ---- */
@font-face { font-family: 'Sarasa UI TC'; font-weight: 400; font-display: block; src: url('/fonts/sarasa-ui-tc-400.woff2') format('woff2'); }
@font-face { font-family: 'Sarasa UI TC'; font-weight: 700; font-display: block; src: url('/fonts/sarasa-ui-tc-700.woff2') format('woff2'); }
@font-face { font-family: 'BIZ UDPMincho'; font-weight: 600 700; font-display: block; src: url('/fonts/biz-udpmincho-700.woff2') format('woff2'); }
@font-face { font-family: 'Noto Serif TC'; font-weight: 600 700; font-display: block; src: url('/fonts/noto-serif-tc-600.woff2') format('woff2'); }
@font-face { font-family: 'LXGW WenKai TC'; font-weight: 400; font-display: block; src: url('/fonts/lxgw-wenkai-tc-400.woff2') format('woff2'); }
@font-face { font-family: 'Cubic 11'; font-weight: 400; font-display: block; src: url('/fonts/cubic-11.woff2') format('woff2'); }
@font-face { font-family: 'Cinzel'; font-weight: 400 900; font-display: block; src: url('/fonts/cinzel-wordmark.woff2') format('woff2'); }

/* ---- shipped tokens (values copied from src/assets/main.css @theme) ---- */
:root {
  --font-sans: 'Sarasa UI TC', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif;
  --font-display: 'BIZ UDPMincho', 'Noto Serif TC', 'PingFang TC', serif;
  --font-lesson: 'LXGW WenKai TC', 'Noto Serif TC', serif;
  --font-num: 'Cubic 11', 'Sarasa UI TC', ui-monospace, monospace;
  --font-brand: 'Cinzel', 'BIZ UDPMincho', serif;

  --color-surface-base: #faf6f0;
  --color-surface-card: #fcf9f3;
  --color-surface-raised: #f4ead8;
  --color-surface-deep: #103029;
  --color-surface-deep-2: #18443a;
  --color-line: #e0d3bd;
  --color-line-subtle: #ece1cd;
  --color-ink: #3d2210;
  --color-ink-muted: #7a5c44;
  --color-ink-on-deep: #e7f1ec;
  --color-ink-on-deep-dim: #9bbdb1;
  --color-primary: #1c7059;
  --color-primary-dark: #155747;
  --color-primary-soft: #cfe9e0;
  --color-success-on-deep: #7fd4a8;
  --color-danger-on-deep: #e08e79;
  --color-gold: #f8b500;
  --color-gold-ink: #3a2408;
  --shadow-card: 0 1px 2px rgba(61, 34, 16, 0.04), 0 4px 14px rgba(61, 34, 16, 0.06);

  /* 地基：字階只用設計文件定的 9 階中的這幾階 */
  --fs-display: 28px; --fs-title: 22px; --fs-h3: 18px; --fs-body: 16px; --fs-sm: 14px; --fs-label: 13px; --fs-num: 11px;
  --r-btn: 8px; --r-card: 12px; --r-panel: 16px;
  --shadow-on-deep: 0 12px 28px rgba(8, 24, 20, 0.42);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #d6d2ca; font-family: var(--font-sans); color: var(--color-ink); -webkit-font-smoothing: antialiased; }
h1, h2, p, figure { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.ico { flex: none; }

/* ---- the sheet (neutral page around the phones) ---- */
.sheet-head { padding: 28px 32px 0; max-width: 980px; }
.sheet-head h1 { font: 700 22px/1.3 var(--font-display); color: #2c2620; }
.sheet-head p { margin-top: 6px; font-size: 14px; line-height: 1.7; color: #564e45; }
.sheet { display: flex; gap: 28px; padding: 24px 32px 48px; width: max-content; }
.frame { flex: none; width: 390px; }
.frame figcaption { height: 72px; font-size: 13px; line-height: 1.55; color: #564e45; }
.frame figcaption b { display: block; font-size: 14px; color: #2c2620; }

/* ---- phone ---- */
.phone { position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--color-surface-base); font-size: var(--fs-body); line-height: 1.5; }
.phone.deep { background: var(--color-surface-deep); color: var(--color-ink-on-deep); }

/* ================= 外框頁 ================= */
.appbar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 20px; background: var(--color-surface-deep); color: var(--color-ink-on-deep); }
.appbar.over { position: absolute; inset: 0 0 auto 0; background: none; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand-mark { color: var(--color-gold); }
.wordmark { font: 600 22px/1 var(--font-brand); letter-spacing: 0.14em; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--color-ink-on-deep-dim); }

.band { position: relative; height: 276px; background: var(--color-surface-deep); color: var(--color-ink-on-deep); overflow: hidden; }
.band-art { position: absolute; inset: 0; }
.band-text { position: absolute; left: 20px; top: 84px; }
.greet { font-size: var(--fs-sm); letter-spacing: 0.12em; color: var(--color-ink-on-deep-dim); }
.greet.num { font-size: 22px; letter-spacing: 0.1em; line-height: 1; margin-bottom: 4px; }
.epigraph { margin-top: 10px; font: 700 26px/1.42 var(--font-display); letter-spacing: 0.02em; }

.page { padding: 16px 16px 0; }
.focus { padding: 18px 20px 20px; border-radius: var(--r-panel); background: var(--color-surface-deep-2); color: var(--color-ink-on-deep); box-shadow: 0 2px 4px rgba(61, 34, 16, 0.1), 0 10px 22px rgba(61, 34, 16, 0.16); }
.focus-kicker { display: flex; align-items: center; gap: 8px; font-size: var(--fs-label); letter-spacing: 0.1em; color: var(--color-ink-on-deep-dim); }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--color-success-on-deep); }
.focus-title { margin-top: 2px; font: 700 24px/1.4 var(--font-display); }
.focus-sub { margin-top: 2px; color: var(--color-ink-on-deep-dim); }
.focus-sub.meta { display: flex; align-items: center; gap: 6px; color: var(--color-ink-on-deep); }
.focus .btn { margin-top: 16px; }
.focus-actions { display: flex; align-items: center; gap: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: var(--r-btn); font-size: var(--fs-body); font-weight: 700; line-height: 1; white-space: nowrap; transition: transform 150ms ease; }
.btn:active { transform: translateY(1px); }
.btn.gold { background: var(--color-gold); color: var(--color-gold-ink); box-shadow: 0 1px 2px rgba(61, 34, 16, 0.24); }
.btn.jade { background: var(--color-primary); color: #fff; box-shadow: 0 1px 2px rgba(61, 34, 16, 0.1); }
.btn.cream { background: var(--color-surface-card); color: var(--color-ink); }
.btn.ghost { border: 1px solid rgba(231, 241, 236, 0.2); color: var(--color-ink-on-deep); }
.btn.ghost.danger { color: var(--color-danger-on-deep); }
.textbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; font-size: var(--fs-body); font-weight: 700; color: var(--color-primary-dark); }
.textbtn.on-deep { font-weight: 400; color: var(--color-ink-on-deep-dim); }
.textbtn[disabled] { opacity: 0.4; }

.sec { margin-top: 18px; }
.sec-label { margin: 0 4px 8px; font-size: var(--fs-label); font-weight: 700; letter-spacing: 0.1em; color: var(--color-ink-muted); }
.row-card { display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 12px 10px 12px 12px; background: var(--color-surface-card); border: 1px solid var(--color-line); border-radius: var(--r-card); box-shadow: var(--shadow-card); }
.chip { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; font: 700 20px/1 var(--font-display); }
.chip.neutral { background: var(--color-surface-raised); color: var(--color-ink-muted); }
.chip.jade { background: var(--color-primary-soft); color: var(--color-primary-dark); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-main b { font-weight: 700; }
.row-main small { font-size: var(--fs-sm); color: var(--color-ink-muted); }
.row-go { display: inline-flex; align-items: center; gap: 2px; font-size: var(--fs-sm); font-weight: 700; color: var(--color-primary-dark); }

.tabbar { position: absolute; left: 50%; bottom: 22px; width: 252px; height: 60px; margin-left: -126px; padding: 6px; display: flex; gap: 4px; border-radius: 30px; background: var(--color-surface-deep); box-shadow: 0 2px 6px rgba(61, 34, 16, 0.18), 0 12px 26px rgba(61, 34, 16, 0.24); }
.tab { flex: 1; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 24px; font-weight: 700; color: var(--color-ink-on-deep-dim); }
.tab.on { background: var(--color-surface-deep-2); color: #fff; }

.page.lost { padding: 32px 20px 0; display: flex; flex-direction: column; align-items: flex-start; }
.lead { color: var(--color-ink-muted); }
.page.lost .btn { margin-top: 24px; }
.page.lost .textbtn { margin-top: 8px; padding: 0 4px; }

/* ================= 棋盤頁 ================= */
.taskbar { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px; }
.backbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: rgba(231, 241, 236, 0.08); }
.t-title { flex: 1; font: 700 20px/1 var(--font-display); letter-spacing: 0.04em; }
.share { font-size: var(--fs-sm); }
.col { padding: 0 16px; }

.side-row { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 2px; }
.side-row b { font-weight: 700; }
.dim { font-size: var(--fs-sm); color: var(--color-ink-on-deep-dim); }
.side-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.turn-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-gold); box-shadow: 0 0 0 3px rgba(248, 181, 0, 0.22); }
.mini-pc { width: 28px; height: 28px; flex: none; margin: -2px -2px 0 -4px; }
.blk { filter: brightness(1.2); }

/* the wooden tray: same recipe as PlayView.vue:328, board floored to 8 × 41px */
.board-frame { position: relative; width: 358px; height: 358px; border-radius: 12px; background: linear-gradient(160deg, #6f4b30, #523722); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(10, 30, 24, 0.45), inset 0 1px 0 rgba(255, 228, 194, 0.2), inset 0 -2px 6px rgba(0, 0, 0, 0.38); }
.cg { position: absolute; left: 15px; top: 15px; width: 328px; height: 328px; background: url('/board/wood12.jpg') 0 0 / 100% 100% no-repeat; }
.pc { position: absolute; width: 41px; height: 41px; }
.sqhl { position: absolute; width: 41px; height: 41px; }
.sqhl.last { background: rgba(155, 199, 0, 0.41); }
.sqhl.check { background: radial-gradient(ellipse at center, rgba(255, 0, 0, 1) 0%, rgba(231, 0, 0, 1) 25%, rgba(169, 0, 0, 0) 89%, rgba(158, 0, 0, 0) 100%); }
.sqhl.played { background: rgba(74, 74, 74, 0.3); }
.sqhl.better { background: rgba(21, 120, 27, 0.2); box-shadow: inset 0 0 0 3px rgba(21, 120, 27, 0.7); }
.arrows { position: absolute; inset: 0; overflow: visible; }
.ranks, .files { position: absolute; display: grid; font-size: 11px; line-height: 1; color: rgba(255, 236, 210, 0.55); }
.ranks { left: 0; top: 15px; width: 15px; height: 328px; grid-template-rows: repeat(8, 41px); }
.files { left: 15px; bottom: 0; width: 328px; height: 15px; grid-template-columns: repeat(8, 41px); }
.ranks span, .files span { display: grid; place-items: center; }

.list-label { margin-top: 10px; padding: 14px 2px 4px; border-top: 1px solid rgba(231, 241, 236, 0.12); font-size: var(--fs-label); font-weight: 700; letter-spacing: 0.1em; color: var(--color-ink-on-deep-dim); }
.moves { padding: 0 2px; font-size: 14px; }
.mv { display: grid; grid-template-columns: 40px 1fr 1fr; align-items: center; height: 30px; }
.mv .n { color: var(--color-ink-on-deep-dim); }
.mv .cur { justify-self: start; margin-left: -8px; padding: 5px 8px; border-radius: 6px; background: rgba(231, 241, 236, 0.12); }
.actions { position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; gap: 12px; }
.actions .btn { flex: 1; }

.list-end { position: absolute; left: 16px; right: 16px; bottom: 96px; height: 1px; background: rgba(231, 241, 236, 0.12); }
.wait-art { position: absolute; inset: 0 0 auto 0; height: 132px; transition: opacity 250ms ease; }
.taskbar, .game-band { position: relative; }

/* game-over card: deep variant of the one Neve box (it asks you to act) */
.over-card { margin-top: 14px; border-radius: var(--r-panel); overflow: hidden; background: var(--color-surface-deep-2); box-shadow: 0 0 0 1px rgba(231, 241, 236, 0.1), var(--shadow-on-deep); }
.over-art { height: 48px; }
.win-line { display: block; height: 2px; background: var(--color-gold); }
.over-body { padding: 18px 20px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.over-title { font: 700 var(--fs-display)/1.25 var(--font-display); letter-spacing: 0.06em; }
.over-neve { margin-top: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.over-neve .neve-tag .num { color: var(--color-ink-on-deep-dim); }
.over-neve .neve-av { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25); filter: brightness(1.08); }
.over-neve .neve-say { margin: 0; color: var(--color-ink-on-deep); }
.over-body .btn { width: 100%; margin-top: 10px; }
.over-body .btn.cream { margin-top: 16px; }
@media (prefers-reduced-motion: no-preference) {
  .enter { animation: rise 260ms cubic-bezier(0, 0, 0.2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
}

/* 棋憶 */
.game-band { position: relative; height: 76px; overflow: hidden; }
.game-band .band-art { transition: opacity 250ms ease; }
.game-text { position: relative; padding: 10px 20px 0; }
.game-line { font-weight: 700; }
.game-sub { font-size: var(--fs-sm); color: var(--color-ink-on-deep-dim); }
.segs { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 2px; }
.segs i { width: 28px; height: 4px; border-radius: 2px; background: rgba(231, 241, 236, 0.2); }
.segs i.done { background: rgba(231, 241, 236, 0.46); }
.segs i.on { background: var(--color-ink-on-deep); }
.segs b { margin-left: auto; font: 400 11px/1 var(--font-num); color: var(--color-ink-on-deep-dim); }

.neve-box { height: 250px; padding: 12px 16px 18px; border-radius: var(--r-panel); background: var(--color-surface-card); border: 1px solid var(--color-line); color: var(--color-ink); box-shadow: var(--shadow-on-deep); display: flex; flex-direction: column; }
.neve-head { display: flex; align-items: center; justify-content: space-between; height: 44px; }
.neve-tag { display: inline-flex; align-items: center; gap: 10px; }
.neve-tag .num { font-size: 11px; letter-spacing: 0.1em; color: var(--color-ink-muted); }
.neve-av { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px var(--color-line); }
.pager { display: flex; gap: 8px; }
.pg { min-width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--color-line); background: var(--color-surface-base); color: var(--color-ink); font-size: var(--fs-sm); font-weight: 700; }
.pg.next { padding: 0 8px 0 14px; gap: 2px; }
.pager.wait .pg { color: var(--color-line); border-color: var(--color-line-subtle); }
.mo-title { margin-top: 8px; font: 700 var(--fs-h3)/1.5 var(--font-display); }
.mo-played { margin-top: 4px; color: var(--color-ink-muted); }
.mo-better { font-weight: 700; }
.neve-say { margin-top: 10px; font: 400 17px/1.8 var(--font-lesson); }
.wait-say { margin-top: auto; }
.progress { margin-top: 20px; margin-bottom: auto; padding-bottom: 20px; display: flex; align-items: center; gap: 12px; }
.track { flex: 1; height: 6px; border-radius: 3px; background: var(--color-line-subtle); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 3px; background: var(--color-primary); }
.pct { font-size: 11px; color: var(--color-ink-muted); }

</style>
</head>
<body>
<header class="sheet-head">
  <h1>方向 B「棋境一景」</h1>
  <p>地基（兩種頁、同一個返回鍵、同一個木框、同一個 Neve 對話框、字階收齊）＋一幅畫：夜裡一張木棋桌的一角。畫只出現在首頁頂帶、棋憶分析等待、空狀態與 404；對局頁只有完局卡頂端一條 48px 的桌緣。時段只改光的方向與冷暖。每一框 390×844。</p>
</header>
<div class="sheet">
