name: Supabase Keep Alive

# Supabase Free Plan 在 7 天內 user database activity 不足會被暫停（暫停後連 DNS 都會撤掉，
# 症狀是 curl 回 "Could not resolve host"）。每天跑一次，每次連打 5 次真實查詢：
# 官方說「每天幾次 user 查詢通常夠」，門檻沒公開，所以不只打一下。
# PostgREST 會實際執行 SQL 才算得上活動，/auth/v1/health 不算。
# 只認 200：打不存在的表只回 404、不碰資料庫，不能算數（舊版把 4xx 當成功）。
# 實證：舊版每 3 天一次、回 200 的匿名查詢，專案仍在 2026-09-10 到 09-13 間被暫停
# （之後連續 10 次 exit 6），所以這個 workflow 是「降低機率」不是保證。
# 變紅多半＝專案已被暫停：先看各次 status 與 curl exit，000／exit 6＝DNS 已撤，
# 去 Supabase dashboard 按 Resume；401／404／5xx 或 exit 3 是別的原因（key、表、secret 網址）。
# 注意：repo 連續 60 天無 commit，GitHub 會自動停用 scheduled workflow（會寄信通知）。

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          fail=0
          for i in 1 2 3 4 5; do
            # curl 連不上時 -w 仍印 000；用 && / || 接住結束碼，讓 -e 不中斷、狀態與 exit code 都留在 log
            code=$(curl -sS --max-time 15 --retry 2 --retry-delay 10 --retry-max-time 60 \
              -o /dev/null -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/journal_entries?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY") && rc=0 || rc=$?
            echo "query $i status: $code (curl exit $rc)"
            [ "$code" = "200" ] || fail=1
            sleep 3
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::有查詢不是 200。000／exit 6＝DNS 已撤（多半專案被暫停，到 Supabase dashboard 按 Resume）；401／404／5xx 或 exit 3 是別的原因"
            exit 1
          fi
